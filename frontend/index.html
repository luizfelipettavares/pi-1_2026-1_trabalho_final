<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Estoque | Painel de Gerenciamento</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body class="light-theme">

    <div id="toast-container" class="toast-container"></div>

    <div id="offline-banner" class="offline-banner" style="display: none;">
        ⚠️ Você está desconectado. Exibindo dados salvos em cache local.
    </div>

    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="logo-icon">📦</span>
                <div>
                    <h1>Central de Estoque</h1>
                    <p>Painel de Gerenciamento de Produtos</p>
                </div>
            </div>
            <button id="toggle-theme" class="btn-theme" aria-label="Alternar tema visual">
                <span class="theme-icon">🌓</span> Alternar Tema
            </button>
        </div>
    </header>

    <main class="dashboard-container">
        
        <div class="forms-column">
            <section class="card animate-in">
                <div class="card-header">
                    <span class="card-icon">📁</span>
                    <h2>Gerenciar Categoria</h2>
                </div>
                <form id="form-categoria" class="form-group">
                    <input type="hidden" id="categoria-id">
                    <div class="input-wrapper">
                        <input type="text" id="cat-nome" placeholder="Ex: Sobremesas, Entradas..." required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="btn-salvar-categoria" class="btn-primary">Salvar Categoria</button>
                        <button type="button" id="btn-cancelar-categoria" class="btn-secondary" style="display:none;">Cancelar</button>
                    </div>
                </form>

                <div class="table-responsive" style="margin-top: 20px; max-height: 200px; overflow-y: auto;">
                    <table class="custom-table" style="font-size: 0.85rem;">
                        <thead>
                            <tr>
                                <th>Categoria</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-categorias-tabela">
                            </tbody>
                    </table>
                </div>
            </section>

            <section class="card animate-in">
                <div class="card-header">
                    <span class="card-icon">🏷️</span>
                    <h2>Gerenciar Produto</h2>
                </div>
                <form id="form-produto" class="form-group">
                    <input type="hidden" id="produto-id">
                    
                    <div class="input-wrapper">
                        <label for="produto-nome">Nome do Produto</label>
                        <input type="text" id="produto-nome" placeholder="Ex: Batata Frita" required>
                    </div>

                    <div class="input-wrapper">
                        <label for="produto-preco">Preço Unitário (R$)</label>
                        <input type="number" id="produto-preco" step="0.01" placeholder="0,00" required>
                    </div>

                    <div class="input-wrapper">
                        <label for="produto-categoria">Categoria vinculada</label>
                        <select id="produto-categoria" required>
                            <option value="">Selecione uma Categoria</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="btn-salvar-produto" class="btn-primary">Salvar Produto</button>
                        <button type="button" id="btn-cancelar-produto" class="btn-secondary" style="display:none;">Cancelar</button>
                    </div>
                </form>
            </section>
        </div>

        <div class="display-column">
            <section class="card table-card animate-in">
                <div class="table-card-header">
                    <div class="card-header">
                        <span class="card-icon">📋</span>
                        <h2>Lista de Produtos Cadastrados</h2>
                    </div>
                    <div class="filter-wrapper">
                        <label for="sort-select">Ordenar por:</label>
                        <select id="sort-select" class="select-clean">
                            <option value="preco_asc">Menor Preço ↑</option>
                            <option value="preco_desc">Maior Preço ↓</option>
                            <option value="nome_asc">Nome (A-Z) 🔤</option>
                            <option value="categoria_asc">Categoria (A-Z) 📁</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th class="text-right">Preço</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-produtos">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
